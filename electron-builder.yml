appId: com.yq.flower
productName: Screen Flower
copyright: Copyright © 2024 YanQue
directories:
  output: dist
  buildResources: resources
files:
  - from: .
  - filter:
      - package.json
      - app
      # 排除 .vscode 目录下的所有文件
      - '!**/.vscode/*'
      # 排除 src 目录下的所有文件
      - '!src/*'
      # 排除配置文件
      - '!electron.vite.config.{js,ts,mjs,cjs}'
      - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.rst}'
      # 排除环境变量文件和 npm 配置文件
      - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
#      - "!node_modules/ffmpeg-static/ffmpeg"

publish: null

#asar: false

extraResources:
#  - resources
  - from: resources
    to: resources

## 指定从asar归档中解压的文件或文件夹
#asarUnpack:
#  # 解压 resources 目录下的所有内容
#  - resources/**

# 不需要签名公证
#afterSign: "electron-builder-notarize"
dmg: {
  icon: 'resources/icons/screen-flower.icns',
  background: 'resources/icons/bg.jpg',
  contents: [
    { # 这个是右边图标及内容
      x: 410,
      y: 190,
      type: 'link',
      path: '/Applications'
    },
    { # 你左边的图标
      x: 130,
      y: 190,
      type: 'file'
    }
  ],
  window: { # 这里是整个窗口的大小
    height: 380,
    width: 540
  }
}

mac: {
  # 应用程序图标
  icon: 'resources/icons/screen-flower.icns',
  # 应用程序包名
  artifactName: '${productName}-${platform}-${arch}-${version}.${ext}',
  target: [ # 要打的包的格式类型设置
            'dmg',
            'zip' # 这里注意更新的时候，mac只认zip格式的包
  ],
  # 是否进行苹果官方的签名
  notarize: false,
  electronUpdaterCompatibility: ">=2.16",
  category: "public.app-category.productivity",
  minimumSystemVersion: "10.12.0",
  darkModeSupport: true,
  hardenedRuntime: true,
  # entitlements: "./resources/build/entitlements.mac.inherit.plist",
  extendInfo: {
    NSMicrophoneUsageDescription: "Screen Flower needs access to the microphone to be able to record audio for screen recordings.",
    NSCameraUsageDescription: "A Screen Flower plugin wants to use the camera.",
    NSUserNotificationAlertStyle: "alert",
    CFBundleDocumentTypes: [
      {
        CFBundleTypeName: "Video",
        CFBundleTypeRole: "Viewer",
        LSHandlerRank: "Alternate",
        LSItemContentTypes: [
          "public.mpeg-4",
          "com.apple.quicktime-movie"
        ]
      }
    ]
  },
}




